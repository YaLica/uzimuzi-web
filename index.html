<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>УЗИ-МУЗИ — Игра</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
            font-family: sans-serif;
        }

        /* Контейнер-лента */
        .swiper-container {
            display: flex;
            width: 300%; 
            height: 100%;
            transition: transform 0.3s ease-out;
        }

        /* Страницы */
        .page {
            width: 33.3333%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            position: relative;
        }

        /* Формат 9:16 */
        .page img, .page video {
            height: 100%;
            aspect-ratio: 9/16;
            object-fit: cover;
            display: block;
        }

        /* Подсказка "Листай" */
        .hint-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            pointer-events: none;
            z-index: 5;
            animation: pulseBlink 2s infinite ease-in-out;
        }

        @keyframes pulseBlink {
            0% { opacity: 0.3; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(0.95); }
        }

        /* Кнопка на видео */
        .play-pause-badge {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: rgba(255, 215, 0, 0.9);
            color: #000000;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="swiper-container" id="swiper">
        <!-- Экран 1: Обложка -->
        <div class="page" id="page1">
            <div class="hint-badge">Листай влево ➔</div>
            <img src="cover.jpg" alt="Обложка">
        </div>

        <!-- Экран 2: Правила -->
        <div class="page" id="page2">
            <div class="hint-badge">Листай влево ➔</div>
            <img src="rules.png" alt="Правила">
        </div>

        <!-- Экран 3: Видео-игра -->
        <div class="page" id="page3">
            <div class="play-pause-badge">🔘 Старт / Стоп</div>
            <video id="gameVideo" loop playsinline preload="auto">
                <source src="game.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        const video = document.getElementById('gameVideo');
        const swiper = document.getElementById('swiper');
        let currentPage = 0;

        /* Умная предзагрузка видео в память телефона */
        window.addEventListener('load', () => {
            video.load();
        });

        function changePage(pageIndex) {
            currentPage = pageIndex;
            swiper.style.transform = `translateX(-${currentPage * 33.3333}%)`;
            
            if (currentPage === 2) {
                video.play().catch(() => {});
            } else {
                video.pause();
            }
        }

        document.getElementById('page1').addEventListener('click', () => changePage(1));
        document.getElementById('page2').addEventListener('click', () => changePage(2));

        let startX = 0;
        document.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });

        document.addEventListener('touchend', (e) => {
            let diffX = startX - e.changedTouches[0].clientX;
            if (diffX > 60 && currentPage < 2) changePage(currentPage + 1);
            if (diffX < -60 && currentPage > 0) changePage(currentPage - 1);
        });

        video.addEventListener('click', (e) => {
            e.stopPropagation();
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        });
    </script>

</body>
</html>
