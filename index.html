<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>УЗИ-МУЗИ — Игра</title>

    <!-- Open Graph теги для красивого превью в мессенджерах (Макс, WhatsApp, Telegram) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="👉 НАЖИМАЙ И ИГРАЙ! 🚀">
    <meta property="og:description" content="Интерактивная игра-тренажер «УЗИ-МУЗИ». Выпуск 1.">
    <meta property="og:image" content="https://yalica.github.io/uzimuzi-web/cover.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1080">
    <meta property="og:image:height" content="1920">

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #000000; user-select: none; -webkit-user-select: none;
            -ms-user-select: none; -moz-user-select: none; font-family: sans-serif;
        }
        .swiper-container { display: flex; width: 300%; height: 100%; transition: transform 0.3s ease-out; }
        .page { width: 33.3333%; height: 100%; display: flex; justify-content: center; align-items: center; background-color: #000000; position: relative; }
        .page img, .page video { height: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; pointer-events: none; }
        .hint-badge {
            position: absolute; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.7); color: #ffffff;
            padding: 8px 14px; border-radius: 20px; font-size: 14px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 1px; border: 1px solid rgba(255, 255, 255, 0.4);
            pointer-events: none; z-index: 5; animation: pulseBlink 2s infinite ease-in-out;
        }
        @keyframes pulseBlink { 0% { opacity: 0.3; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } 100% { opacity: 0.3; transform: scale(0.95); } }
        .play-pause-badge {
            position: absolute; bottom: 30px; right: 20px; background: rgba(255, 215, 0, 0.9); color: #000000;
            padding: 10px 16px; border-radius: 30px; font-size: 14px; font-weight: bold;
            text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,0.3); pointer-events: none; z-index: 5;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="swiper-container" id="swiper">
        <div class="page" id="page1">
            <div class="hint-badge">Листай влево ➔</div>
            <img id="img1" alt="Обложка">
        </div>
        <div class="page" id="page2">
            <div class="hint-badge">Листай влево ➔</div>
            <img id="img2" alt="Правила">
        </div>
        <div class="page" id="page3">
            <div class="play-pause-badge">🔘 Старт / Стоп</div>
            <video id="gameVideo" loop playsinline preload="auto" controlslist="nodownload nofullscreen noremoteplayback">
                <source id="videoSrc" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        // Замаскированные имена файлов: cover.png, rules.png, game.mp4
        const _0x1a = ['Y292ZXIucG5n', 'cnVsZXMucG5n', 'Z2FtZS5tcDQ=']; 
        const decode = (str) => atob(str);

        const video = document.getElementById('gameVideo');
        const swiper = document.getElementById('swiper');
        let currentPage = 0;

        document.getElementById('img1').src = decode(_0x1a[0]);
        document.getElementById('img2').src = decode(_0x1a[1]);
        document.getElementById('videoSrc').src = decode(_0x1a[2]);

        window.addEventListener('load', () => { video.load(); });

        function changePage(pageIndex) {
            currentPage = pageIndex;
            swiper.style.transform = `translateX(-${currentPage * 33.3333}%)`;
            if (currentPage === 2) { video.play().catch(() => {}); } else { video.pause(); }
        }

        document.getElementById('page1').addEventListener('click', () => changePage(1));
        document.getElementById('page2').addEventListener('click', () => changePage(2));

        let startX = 0;
        document.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
        document.addEventListener('touchend', (e) => {
            let diffX = startX - e.changedTouches[0].clientX;
            if (diffX > 60 && currentPage < 2) changePage(currentPage + 1);
            if (diffX < -60 && currentPage > 0) changePage(currentPage - 1);
        });

        document.getElementById('page3').addEventListener('click', (e) => {
            if (video.paused) { video.play(); } else { video.pause(); }
        });

        // Блокировка горячих клавиш (F12, Ctrl+Shift+I, Ctrl+U)
        document.addEventListener('keydown', function(e) {
            if (e.keyCode == 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || 
                (e.ctrlKey && e.keyCode == 85)) {
                e.preventDefault();
                return false;
            }
        });

        // Запрет контекстного меню на смартфонах при долгом нажатии
        window.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);
    </script>

</body>
</html>
